<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in to Studio Presence</title>
  </head>
  <body style="margin:0; padding:0; background:#f4f4f0; color:#141414; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f4f0;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px; background:#ffffff; border:1px solid #deded7;">
            <tr>
              <td style="padding:32px 32px 8px; font-size:20px; font-weight:700; letter-spacing:-0.3px;">Studio Presence</td>
            </tr>
            <tr>
              <td style="padding:24px 32px 8px; font-size:28px; line-height:34px; font-weight:700;">Sign in to your workspace</td>
            </tr>
            <tr>
              <td style="padding:8px 32px 24px; font-size:16px; line-height:24px; color:#4d4d49;">
                Use the secure link below to sign in. It works once and expires automatically.
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:14px 20px; background:#141414; color:#ffffff; font-size:16px; font-weight:700; line-height:20px; text-decoration:none;">Sign in to Studio Presence</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px; border-top:1px solid #deded7; font-size:13px; line-height:20px; color:#676762;">
                If you did not request this email, you can ignore it. Do not forward this link.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
