<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locations Architecture — Ashish Interiors Multi-City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #141414;
      --accent: #51372A;
      --cta: #D9BC72;
      --surface: #FFFFFF;
      --body: #3c3c3c;
      --muted: #8B8377;
      --hairline: #DCD7CE;
      --panel: #FAF8F5;
      --font-display: 'Archivo', Helvetica, Arial, sans-serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    body {
      background: #121110;
      color: #e2ded5;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    .master-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #171513;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px clamp(14px, 2.5vw, 36px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      background: var(--cta);
      color: var(--ink);
      font-weight: 700;
      font-size: 11px;
      padding: 3px 7px;
      letter-spacing: 0.1em;
      text-decoration: none;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #f7f5f0;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #8b8377;
    }

    .proto-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f5f2ed;
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--cta);
      color: var(--ink);
      border-color: var(--cta);
    }

    .nav-btn.primary {
      background: var(--cta);
      color: var(--ink);
      border-color: var(--cta);
      font-weight: 600;
    }

    /* Sub-bar / Viewport Switcher */
    .sub-bar {
      background: #1e1b19;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px clamp(14px, 2.5vw, 36px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .viewport-pills {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .vp-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #c2bcb2;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .vp-btn:hover, .vp-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .status-summary {
      font-size: 11.5px;
      color: #b8b1a4;
    }

    .status-summary strong {
      color: var(--cta);
    }

    /* Main Stage */
    .stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
      background: #0d0c0b;
      min-height: calc(100vh - 100px);
    }

    .frame-container {
      width: 100%;
      height: calc(100vh - 130px);
      min-height: 800px;
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: width 0.3s ease;
    }

    .frame-container.desktop {
      width: 100%;
      max-width: 1340px;
    }

    .frame-container.tablet {
      width: 768px;
    }

    .frame-container.mobile {
      width: 375px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <header class="master-bar">
    <div class="brand-section">
      <a href="/locations" class="brand-mark">AI</a>
      <div>
        <div class="brand-title">Locations Architectural Ledger</div>
        <div class="brand-subtitle">Multi-City & Regional Territories Design</div>
      </div>
    </div>

    <div class="proto-controls">
      <a href="locations-iteration-1.html" target="_blank" class="nav-btn">
        <span>Open Standalone Tab ↗</span>
      </a>
      <a href="/locations" class="nav-btn primary">
        <span>Live Next.js Route ↗</span>
      </a>
    </div>
  </header>

  <!-- Sub Bar: Viewport controls -->
  <div class="sub-bar">
    <div class="viewport-pills">
      <button class="vp-btn active" onclick="setViewport('desktop', this)">Desktop (1340px)</button>
      <button class="vp-btn" onclick="setViewport('tablet', this)">Tablet (768px)</button>
      <button class="vp-btn" onclick="setViewport('mobile', this)">Mobile (375px)</button>
    </div>

    <div class="status-summary">
      Selected: <strong>The Architectural Ledger</strong> · 6 Multi-City Locations & Territory Directory
    </div>
  </div>

  <!-- Stage -->
  <main class="stage">
    <div class="frame-container desktop" id="frameWrapper">
      <iframe id="protoFrame" src="locations-iteration-1.html" title="Locations Architectural Ledger"></iframe>
    </div>
  </main>

  <script>
    function setViewport(size, btn) {
      document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const wrap = document.getElementById('frameWrapper');
      wrap.className = 'frame-container ' + size;
    }
  </script>
</body>
</html>
