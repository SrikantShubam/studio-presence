<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #FAF8F5; -webkit-font-smoothing: antialiased; }
  a { color: #51372A; text-decoration: none; }
  a:hover { color: #141414; }
</style>
</helmet>

<div style="background:#FAF8F5;color:#141414;font-family:'Neue Haas Grotesk','Helvetica Neue',Helvetica,Archivo,Arial,sans-serif;overflow-x:hidden">

  <section data-screen-label="Testimonials — carousel" style="position:relative;padding:clamp(64px,8vw,120px) clamp(20px,5vw,72px) clamp(52px,6.5vw,92px) clamp(20px,5vw,72px);border-top:1px solid #51372A;border-bottom:1px solid #51372A">

    <!-- ghost numeral, bled behind the quote -->
    <span style="position:absolute;left:50%;top:{{ ghostTop }};transform:translateX(-50%);font-size:clamp(200px,30vw,480px);font-weight:200;line-height:.7;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px rgba(81,55,42,.09);pointer-events:none;user-select:none">{{ ghostNumeral }}</span>

    <!-- header -->
    <div style="position:relative;display:grid;grid-template-columns:{{ headCols }};gap:clamp(24px,4vw,64px);align-items:end;margin-bottom:clamp(56px,7.5vw,104px)">
      <div style="display:grid;gap:9px;padding-bottom:.75em;font-size:10px;font-weight:400;letter-spacing:.3em;line-height:1.6;text-transform:uppercase;color:#51372A">
        <span>(SAY)</span>
        <span>IN THEIR</span>
        <span>OWN WORDS</span>
      </div>
      <h2 style="margin:0;font-size:clamp(40px,7vw,100px);font-weight:200;line-height:.86;letter-spacing:-.045em;text-transform:uppercase">WHAT<br /><span style="display:block;margin-left:.5em;color:#51372A">CLIENTS SAY</span></h2>
      <span style="display:{{ noteDisplay }};justify-self:end;padding-bottom:.9em;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8B8377">sample content — replace with real client quotes</span>
    </div>

    <!-- quote -->
    <div style="position:relative;display:grid;grid-template-columns:{{ quoteCols }};gap:clamp(16px,3vw,48px);align-items:center;max-width:1240px;margin:0 auto">

      <button type="button" onClick="{{ prev }}" aria-label="Previous testimonial" style="display:{{ arrowDisplay }};align-items:center;justify-content:center;width:46px;height:46px;background:none;border:0;border-bottom:1px solid #51372A;color:#141414;font:inherit;font-size:15px;cursor:pointer;padding:0;justify-self:start" style-hover="color:#51372A">&#8592;</button>

      <div style="display:grid;justify-items:center;text-align:center;gap:clamp(30px,3.8vw,48px)">
        <blockquote style="margin:0;max-width:{{ measure }}">
          <p style="margin:0;font-size:clamp(23px,3.6vw,52px);font-weight:200;line-height:1.22;letter-spacing:-.032em;color:#141414;text-wrap:balance">{{ item.quote }}</p>
        </blockquote>

        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(12px,1.6vw,20px)">
          <span style="display:block;width:clamp(38px,4vw,46px);height:clamp(38px,4vw,46px);flex-shrink:0;border-radius:50%;overflow:hidden;background:#EAE6DF">
            <img src="{{ item.photo }}" alt="{{ item.name }}" style="width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.04)" />
          </span>
          <span style="font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase">{{ item.name }}</span>
          <span style="width:22px;height:1px;background:#51372A"></span>
          <span style="font-size:10.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:#8B8377">{{ item.meta }}</span>
        </div>
      </div>

      <button type="button" onClick="{{ next }}" aria-label="Next testimonial" style="display:{{ arrowDisplay }};align-items:center;justify-content:center;width:46px;height:46px;background:none;border:0;border-bottom:1px solid #51372A;color:#141414;font:inherit;font-size:15px;cursor:pointer;padding:0;justify-self:end" style-hover="color:#51372A">&#8594;</button>
    </div>

    <!-- dash indicators -->
    <div style="position:relative;display:flex;justify-content:center;align-items:center;gap:10px;margin-top:clamp(48px,6vw,84px)">
      <sc-for list="{{ dashes }}" as="d" hint-placeholder-count="4">
        <button type="button" onClick="{{ d.select }}" aria-label="{{ d.label }}" style="width:{{ d.width }};height:36px;padding:0;background:none;border:0;cursor:pointer;display:flex;align-items:center">
          <span style="display:block;width:100%;height:1.5px;background:{{ d.color }}"></span>
        </button>
      </sc-for>
      <span style="margin-left:14px;font-size:10px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:#8B8377">{{ counter }}</span>
    </div>

    <div style="display:{{ mobileArrowDisplay }};justify-content:center;gap:12px;margin-top:20px">
      <button type="button" onClick="{{ prev }}" aria-label="Previous testimonial" style="display:flex;align-items:center;justify-content:center;width:46px;height:46px;background:none;border:1px solid #51372A;color:#141414;font:inherit;font-size:15px;cursor:pointer;padding:0">&#8592;</button>
      <button type="button" onClick="{{ next }}" aria-label="Next testimonial" style="display:flex;align-items:center;justify-content:center;width:46px;height:46px;background:none;border:1px solid #51372A;color:#141414;font:inherit;font-size:15px;cursor:pointer;padding:0">&#8594;</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440}}">
const px = id => "https://images.pexels.com/photos/" + id + "/pexels-photo-" + id + ".jpeg?auto=compress&cs=tinysrgb&w=400";

const QUOTES = [
  {
    quote: "\u201CThey gave us a dated schedule and stuck to it. The kitchen was done in five weeks and the bill matched the estimate.\u201D",
    name: "R. KUMAR", meta: "BORING ROAD \u00B7 3BHK TURNKEY", photo: px(2379004)
  },
  {
    quote: "\u201CSmall flat, small budget, and still no shortcuts on the plywood. They talked me out of two things I would have regretted.\u201D",
    name: "S. DEVI", meta: "KANKARBAGH \u00B7 2BHK", photo: px(3778603)
  },
  {
    quote: "\u201CWeekly site photographs meant I could follow the whole job from Delhi without calling anyone.\u201D",
    name: "A. SINHA", meta: "PATLIPUTRA \u00B7 DUPLEX", photo: px(2182970)
  },
  {
    quote: "\u201CWe asked them back for our office two years later. The same supervisor turned up \u2014 that says enough.\u201D",
    name: "M. PRASAD", meta: "S.K. PURI \u00B7 OFFICE", photo: px(3777943)
  }
];

class Component extends DCLogic {
  state = { w: typeof window !== "undefined" ? window.innerWidth : 1440, i: 0 };

  componentDidMount() {
    this._onResize = () => {
      const w = window.innerWidth;
      if (Math.abs(w - this.state.w) > 4) this.setState({ w });
    };
    window.addEventListener("resize", this._onResize);
    this._onResize();
  }

  componentWillUnmount() { window.removeEventListener("resize", this._onResize); }

  go(n) { this.setState({ i: (n + QUOTES.length) % QUOTES.length }); }

  renderVals() {
    const s = this.state;
    const mobile = s.w < 760;

    return {
      headCols: mobile ? "1fr" : "auto 1fr auto",
      noteDisplay: mobile ? "none" : "block",
      quoteCols: mobile ? "1fr" : "46px minmax(0,1fr) 46px",
      arrowDisplay: mobile ? "none" : "flex",
      mobileArrowDisplay: mobile ? "flex" : "none",
      measure: mobile ? "16em" : "22em",
      ghostTop: mobile ? "34%" : "38%",
      ghostNumeral: String(s.i + 1).padStart(2, "0"),

      item: QUOTES[s.i],
      counter: String(s.i + 1).padStart(2, "0") + " / " + String(QUOTES.length).padStart(2, "0"),

      dashes: QUOTES.map((q, n) => ({
        label: "Show testimonial " + (n + 1),
        width: n === s.i ? "34px" : "18px",
        color: n === s.i ? "#141414" : "#C7BEB0",
        select: () => this.go(n)
      })),

      prev: () => this.go(s.i - 1),
      next: () => this.go(s.i + 1)
    };
  }
}
</script>
</body>
</html>
