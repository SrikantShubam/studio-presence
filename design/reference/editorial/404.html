<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #FFFFFF; -webkit-font-smoothing: antialiased; }
  a { color: #51372A; text-decoration: none; }
  a:hover { color: #141414; }
</style>
</helmet>

<div style="display:flex;flex-direction:column;min-height:100vh;background:#FFFFFF;color:#141414;font-family:'Neue Haas Grotesk','Helvetica Neue',Helvetica,Archivo,Arial,sans-serif;overflow-x:hidden">

  <!-- NAV -->
  <nav style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:clamp(20px,3vw,34px) clamp(20px,5vw,64px);border-bottom:1px solid #51372A">
    <a href="Studio design 1.dc.html" style="display:grid;gap:3px;font-size:clamp(12px,1.2vw,15px);font-weight:500;letter-spacing:.26em;line-height:1;text-transform:uppercase;color:#141414">
      <span>ASHISH</span>
      <span>INTERIORS</span>
    </a>
    <div style="display:{{ navRowDisplay }};align-items:center;gap:clamp(18px,2.6vw,38px);font-size:11.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase">
      <a href="Studio design 1.dc.html" style="color:#141414">HOME</a>
      <a href="service-detail.dc.html" style="color:#141414">SERVICES</a>
      <a href="team.dc.html" style="color:#141414">STUDIO</a>
      <a href="projects-category.dc.html" style="color:#141414">PORTFOLIO</a>
      <a href="locations.dc.html" style="color:#141414">CONTACT</a>
    </div>
    <div style="display:{{ navPhoneDisplay }};align-items:center;gap:16px;font-size:12px;font-weight:400;letter-spacing:.14em">
      <span style="width:1px;height:16px;background:#51372A"></span>
      <span>(555) 0123</span>
    </div>
  </nav>

  <!-- 404 -->
  <main data-screen-label="404" style="flex:1;display:grid;grid-template-columns:{{ cols }};gap:clamp(32px,6vw,88px);align-items:center;padding:clamp(56px,10vw,140px) clamp(20px,5vw,64px)">
    <div>
      <div style="display:grid;gap:6px;margin-bottom:clamp(20px,3vw,34px);font-size:10.5px;font-weight:400;letter-spacing:.24em;line-height:1.6;text-transform:uppercase;color:#51372A">
        <span>ERROR 404 —</span>
        <span>PAGE NOT FOUND</span>
      </div>
      <h1 style="margin:0;font-size:clamp(46px,9vw,116px);font-weight:300;line-height:.88;letter-spacing:-.03em;text-transform:uppercase">NOTHING<br /><span style="display:block;margin-left:.55em;color:#51372A">BUILT HERE</span></h1>
      <p style="margin:clamp(28px,4vw,44px) 0 0 0;max-width:26em;font-size:clamp(16px,1.8vw,19px);line-height:1.6;color:#4A4A4A;text-wrap:pretty">This page does not exist &mdash; or it did, and we took it down.</p>
      <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:clamp(32px,4.5vw,52px)">
        <a href="Studio design 1.dc.html" style="display:inline-flex;align-items:center;gap:14px;padding:20px 34px;min-height:44px;background:#D9BC72;color:#141414;font-size:clamp(10.5px,1.1vw,12px);font-weight:500;letter-spacing:.18em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,100% 62%,calc(100% - 20px) 100%,0 100%)" style-hover="background:#141414;color:#D9BC72">BACK TO THE HOME PAGE <span>&#8594;</span></a>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px clamp(18px,2.6vw,32px);margin-top:clamp(32px,4vw,48px);padding-top:22px;border-top:1px solid #51372A;font-size:11.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase">
        <a href="projects-category.dc.html" style="color:#141414">PORTFOLIO</a>
        <a href="service-detail.dc.html" style="color:#141414">SERVICES</a>
        <a href="locations.dc.html" style="color:#141414">VISIT THE STUDIO</a>
      </div>
    </div>

    <div style="position:relative;display:{{ frameDisplay }};justify-content:center;align-items:center;min-height:340px">
      <div style="position:absolute;top:0;left:26px;right:-26px;bottom:52px;border:1px solid #51372A;pointer-events:none"></div>
      <div style="position:relative;display:grid;place-items:center;width:100%;max-width:420px;aspect-ratio:4/5;margin:26px 26px 0 0;border:1px solid #DCD7CE">
        <span style="font-size:clamp(120px,15vw,220px);font-weight:300;line-height:.8;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px #DCD7CE">404</span>
      </div>
    </div>
  </main>

  <!-- MINIMAL FOOTER BAR -->
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;padding:22px clamp(20px,5vw,64px);background:#141414;color:#FFFFFF;font-size:10.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase">
    <span>&copy; 2026 ASHISH INTERIORS &middot; PATNA</span>
    <span>(555) 0123</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440}}">
class Component extends DCLogic {
  state = { w: typeof window !== "undefined" ? window.innerWidth : 1440 };

  componentDidMount() {
    this._onResize = () => {
      const w = window.innerWidth;
      if (Math.abs(w - this.state.w) > 4) this.setState({ w });
    };
    window.addEventListener("resize", this._onResize);
    this._onResize();
  }

  componentWillUnmount() { window.removeEventListener("resize", this._onResize); }

  renderVals() {
    const w = this.state.w;
    const mobile = w < 720, tablet = w >= 720 && w < 1080;
    return {
      navRowDisplay: mobile || tablet ? "none" : "flex",
      navPhoneDisplay: mobile ? "none" : "flex",
      cols: mobile || tablet ? "1fr" : "1.15fr .85fr",
      frameDisplay: mobile ? "none" : "flex"
    };
  }
}
</script>
</body>
</html>
