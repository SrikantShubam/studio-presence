<!-- Extracted from ashish-interiors---home-(standalone).html. {{ }} are Claude Design's own template bindings, not this project's config system — leave them as-is. -->
<section id="contact" data-screen-label="Contact" style="padding:clamp(64px,9vw,120px) clamp(20px,5vw,64px);background:#FAF8F5;border-top:1px solid #51372A">
    <div style="display:grid;grid-template-columns:{{ contactCols }};gap:clamp(36px,6vw,90px);align-items:start">
      <div>
        <h2 style="margin:0;font-size:clamp(40px,7.5vw,92px);font-weight:300;line-height:.88;letter-spacing:-.03em;text-transform:uppercase">COME<br><span style="display:block;margin-left:.55em;color:#51372A">SEE US</span></h2>
        <div style="display:grid;grid-template-columns:{{ contactInfoCols }};gap:26px clamp(24px,4vw,48px);margin-top:clamp(32px,4.5vw,52px);max-width:{{ contactInfoMax }}">
          <div style="display:grid;gap:8px;padding-bottom:22px;border-bottom:1px solid #DCD7CE">
            <span style="font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#51372A">PHONE</span>
            <span style="font-size:clamp(20px,2.4vw,24px);font-weight:400">(555) 0123</span>
          </div>
          <div style="display:grid;gap:8px;padding-bottom:22px;border-bottom:1px solid #DCD7CE">
            <span style="font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#51372A">WHATSAPP</span>
            <span style="font-size:clamp(20px,2.4vw,24px);font-weight:400">(555) 0123</span>
          </div>
          <div style="display:grid;gap:8px;padding-bottom:22px;border-bottom:1px solid #DCD7CE">
            <span style="font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#51372A">STUDIO</span>
            <span style="font-size:16px;line-height:1.6">2nd Floor, Boring Road Crossing,<br>Patna, Bihar 800001</span>
          </div>
          <div style="display:grid;gap:8px">
            <span style="font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#51372A">HOURS</span>
            <span style="font-size:16px;line-height:1.6">Mon–Sat, 10:00 – 19:00<br>Sunday by appointment</span>
          </div>
        </div>
        <a href="#contact" style="display:inline-flex;align-items:center;gap:14px;margin-top:clamp(32px,4.5vw,52px);padding:20px 34px;background:#D9BC72;color:#141414;font-size:clamp(10.5px,1.1vw,12px);font-weight:500;letter-spacing:.18em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,100% 62%,calc(100% - 20px) 100%,0 100%)" style-hover="background:#141414;color:#D9BC72">CALCULATE THE ESTIMATE <span>↗</span></a>
      </div>
      <div style="min-height:{{ mapMinHeight }};background:repeating-linear-gradient(135deg,#E8E4DD 0 9px,#DED9D1 9px 18px);display:flex;align-items:center;justify-content:center;padding:20px;border:1px solid #51372A;text-align:center">
        <span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8B8377">map placeholder — boring road crossing, patna</span>
      </div>
    </div>
  </section>
