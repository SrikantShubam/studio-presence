<!-- Extracted from ashish-interiors---home-(standalone).html. {{ }} are Claude Design's own template bindings, not this project's config system — leave them as-is. -->
<section id="hero" data-screen-label="Hero" style="position:relative;min-height:min(860px,100vh);background:repeating-linear-gradient(135deg,#3A322B 0 10px,#332C26 10px 20px);overflow:hidden">
    <img src="fb9eaa17-9c87-47ad-a2cb-10a113fc9bd1" alt="Warm lived-in living room" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,20,.6) 0%,rgba(20,20,20,.16) 34%,rgba(20,20,20,.58) 100%)"></div>

    <nav style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:clamp(20px,3vw,34px) clamp(20px,5vw,64px);color:#FFFFFF">
      <div style="display:grid;gap:3px;font-size:clamp(12px,1.2vw,15px);font-weight:500;letter-spacing:.26em;line-height:1;text-transform:uppercase">
        <span>ASHISH</span>
        <span>INTERIORS</span>
      </div>
      <div style="display:{{ navRowDisplay }};align-items:center;gap:clamp(18px,2.6vw,38px);font-size:11.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase">
        <a href="#hero" style="color:#FFFFFF">HOME</a>
        <a href="#services" style="color:#FFFFFF">SERVICES</a>
        <a href="#about" style="color:#FFFFFF">ABOUT</a>
        <a href="#portfolio" style="color:#FFFFFF">PORTFOLIO</a>
        <a href="#contact" style="color:#FFFFFF">CONTACT</a>
      </div>
      <div style="display:{{ navPhoneDisplay }};align-items:center;gap:16px;font-size:12px;font-weight:400;letter-spacing:.14em">
        <span style="width:1px;height:16px;background:rgba(255,255,255,.4)"></span>
        <span>(555) 0123</span>
      </div>
      <button type="button" sc-camel-on-click="{{ toggleMenu }}" style="display:{{ menuBtnDisplay }};flex-direction:column;gap:5px;width:44px;height:44px;align-items:center;justify-content:center;background:none;border:1px solid rgba(255,255,255,.5);cursor:pointer;padding:0">
        <span style="display:block;width:20px;height:1px;background:#FFFFFF"></span>
        <span style="display:block;width:20px;height:1px;background:#FFFFFF"></span>
        <span style="display:block;width:20px;height:1px;background:#FFFFFF"></span>
      </button>
    </nav>

    <div style="position:relative;display:{{ menuPanelDisplay }};flex-direction:column;gap:2px;margin:0 clamp(20px,5vw,64px);padding:18px 0;border-top:1px solid rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.3);font-size:13px;font-weight:400;letter-spacing:.2em;text-transform:uppercase">
      <a href="#services" sc-camel-on-click="{{ closeMenu }}" style="color:#FFFFFF;padding:11px 0">SERVICES</a>
      <a href="#about" sc-camel-on-click="{{ closeMenu }}" style="color:#FFFFFF;padding:11px 0">ABOUT</a>
      <a href="#portfolio" sc-camel-on-click="{{ closeMenu }}" style="color:#FFFFFF;padding:11px 0">PORTFOLIO</a>
      <a href="#contact" sc-camel-on-click="{{ closeMenu }}" style="color:#FFFFFF;padding:11px 0">CONTACT</a>
      <a href="#contact" sc-camel-on-click="{{ closeMenu }}" style="color:#FFFFFF;padding:11px 0">(555) 0123</a>
    </div>

    <div style="position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:clamp(48px,7vw,96px) clamp(20px,5vw,64px) clamp(120px,14vw,160px) clamp(20px,5vw,64px)">
      <div style="max-width:1000px">
        <div style="display:grid;gap:6px;margin-bottom:clamp(24px,4vw,44px);font-size:clamp(9.5px,1vw,11px);font-weight:400;letter-spacing:.24em;line-height:1.5;text-transform:uppercase;color:rgba(255,255,255,.8)">
          <span>INTERIOR DESIGN STUDIO —</span>
          <span>RESIDENTIAL &amp; COMMERCIAL,</span>
          <span>SINCE 2013</span>
        </div>
        <h1 style="margin:0;font-size:clamp(44px,11vw,140px);font-weight:300;line-height:.9;letter-spacing:-.025em;text-transform:uppercase;color:#FFFFFF">ASHISH<br>INTERIORS</h1>
        <p style="margin:clamp(18px,2.4vw,28px) 0 0 0;max-width:16em;font-size:clamp(15px,1.6vw,21px);font-weight:400;line-height:1.25;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.92)">CREATING INTERIORS THAT INSPIRE</p>
        <a href="#contact" style="display:inline-flex;align-items:center;gap:14px;margin-top:clamp(32px,4.5vw,52px);padding:20px 34px;background:#D9BC72;color:#141414;font-size:clamp(10.5px,1.1vw,12px);font-weight:500;letter-spacing:.18em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,100% 62%,calc(100% - 20px) 100%,0 100%)" style-hover="background:#141414;color:#D9BC72">CALCULATE THE ESTIMATE <span>↗</span></a>
      </div>
      <div style="display:{{ heroAsideDisplay }};gap:12px;padding-top:14px;text-align:right;font-size:clamp(9.5px,1vw,11px);font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:#FFFFFF">
        <span>APARTMENTS</span>
        <span style="height:1px;background:rgba(255,255,255,.35);justify-self:end;width:36px"></span>
        <span>HOUSES</span>
        <span style="height:1px;background:rgba(255,255,255,.35);justify-self:end;width:36px"></span>
        <span>OFFICES</span>
      </div>
    </div>

    <div style="position:absolute;left:clamp(20px,5vw,64px);bottom:clamp(24px,4vw,44px);font-size:clamp(9.5px,1vw,11px);font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#FFFFFF">EST. 2013 · PATNA</div>
  </section>
