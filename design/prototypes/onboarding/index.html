<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Presence — onboarding prototype</title>
  <style>
    :root { --ink:#20211f; --muted:#6d7069; --paper:#f5f3ed; --surface:#fffdf8; --line:#d9d7ce; --accent:#315c4b; --accent-soft:#e3eee8; --warm:#eee4d6; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.55 Inter, ui-sans-serif, system-ui, sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; } .shell { min-height:100vh; display:grid; grid-template-columns:260px 1fr; }
    aside { padding:34px 28px; border-right:1px solid var(--line); background:#eeeae1; } .brand { font-weight:700; letter-spacing:-.03em; }
    .prototype { margin-top:38px; color:var(--muted); font-size:12px; } .steps { margin:34px 0 0; padding:0; list-style:none; }
    .steps li { display:flex; gap:12px; align-items:flex-start; padding:13px 0; color:var(--muted); } .steps li.active { color:var(--ink); font-weight:650; }
    .num { width:26px; height:26px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; font-size:12px; flex:none; } .active .num { color:white; background:var(--accent); border-color:var(--accent); }
    main { padding:42px clamp(24px,7vw,100px); } .top { display:flex; justify-content:space-between; gap:20px; max-width:980px; margin:auto; color:var(--muted); font-size:13px; }
    .content { max-width:980px; margin:70px auto 0; display:grid; grid-template-columns:minmax(0,530px) 300px; gap:80px; align-items:start; }
    h1 { margin:0; max-width:520px; font:500 clamp(38px,5vw,64px)/1.02 Georgia, serif; letter-spacing:-.055em; } .intro { max-width:480px; margin:20px 0 38px; color:var(--muted); font-size:17px; }
    .field { margin:25px 0; } label, legend { display:block; margin-bottom:8px; font-weight:650; } input { width:100%; border:0; border-bottom:1px solid #aaa99f; background:transparent; padding:11px 0; outline:none; color:var(--ink); } input:focus { border-color:var(--accent); box-shadow:0 2px 0 var(--accent); }
    .chips { display:flex; flex-wrap:wrap; gap:8px; } .chip { border:1px solid var(--line); border-radius:999px; padding:8px 13px; background:transparent; color:var(--muted); } .chip.selected { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
    .actions { display:flex; justify-content:space-between; margin-top:42px; } .primary { border:0; border-radius:3px; padding:12px 20px; background:var(--accent); color:white; } .secondary { border:0; background:none; color:var(--muted); }
    .preview { position:sticky; top:30px; border:1px solid var(--line); background:var(--surface); padding:20px; } .preview-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.14em; } .preview h2 { margin:45px 0 8px; font:500 29px/1.05 Georgia,serif; } .preview p { color:var(--muted); } .rule { height:1px; background:var(--line); margin:22px 0; }
    .notice { margin-top:30px; padding:12px 14px; background:var(--warm); color:#5f554b; font-size:13px; } .hidden { display:none; }
    @media (max-width:760px) { .shell { display:block; } aside { padding:20px; border-right:0; border-bottom:1px solid var(--line); } .prototype { margin-top:12px; } .steps { display:flex; gap:16px; margin-top:20px; } .steps li { padding:0; } .steps li span:last-child { display:none; } main { padding:28px 20px 48px; } .content { display:block; margin-top:44px; } .preview { position:static; margin-top:44px; } h1 { font-size:46px; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside><div class="brand">Studio Presence</div><div class="prototype">VISUAL PROTOTYPE<br>Not connected to auth or data</div><ol class="steps"><li class="active"><span class="num">1</span><span>Your studio</span></li><li><span class="num">2</span><span>Photos and branding</span></li><li><span class="num">3</span><span>Review</span></li></ol></aside>
    <main><div class="top"><span>Set up your preview</span><span id="counter">1 of 3</span></div><div class="content"><section id="stage"></section><aside class="preview"><div class="preview-label">Live preview</div><h2 id="previewName">Your studio</h2><p id="previewText">A clear, considered website starts with a few details from you.</p><div class="rule"></div><p id="previewMeta">Your service areas and focus will appear here.</p></aside></div></main>
  </div>
  <script>
    const state={stage:1,name:'',areas:'',categories:[],services:[],phone:'',whatsapp:true,email:''};
    const categories=['Residential','Office','Retail','Hospitality']; const services=['Interior design','Renovation','Turnkey projects','Design consultation','Modular kitchen'];
    const stage=document.querySelector('#stage');
    const selected=(arr,value)=>arr.includes(value)?'selected':'';
    function render(){
      document.querySelector('#counter').textContent=state.stage+' of 3'; document.querySelectorAll('.steps li').forEach((el,i)=>el.classList.toggle('active',i===state.stage-1));
      document.querySelector('#previewName').textContent=state.name||'Your studio'; document.querySelector('#previewText').textContent=state.name?`${state.name} creates thoughtful spaces for people who care how a place feels.`:'A clear, considered website starts with a few details from you.'; document.querySelector('#previewMeta').textContent=state.areas?`Serving ${state.areas}.`:'Your service areas and focus will appear here.';
      if(state.stage===1) stage.innerHTML=`<h1>Let’s make this studio yours.</h1><p class="intro">Tell us enough to shape a first preview. You can refine the details later.</p><div class="field"><label for="name">Studio name</label><input id="name" value="${state.name}" placeholder="e.g. GG Studio"></div><div class="field"><label for="areas">Where do you serve?</label><input id="areas" value="${state.areas}" placeholder="e.g. South Delhi, Gurugram"></div><div class="field"><label>What categories do you work in?</label><div class="chips">${categories.map(x=>`<button class="chip ${selected(state.categories,x)}" data-cat="${x}">${x}</button>`).join('')}</div></div><div class="field"><label>What services do you offer?</label><div class="chips">${services.map(x=>`<button class="chip ${selected(state.services,x)}" data-service="${x}">${x}</button>`).join('')}</div></div><div class="actions"><button class="secondary" disabled>Back</button><button class="primary" id="next">Continue</button></div>`;
      if(state.stage===2) stage.innerHTML=`<h1>Give the preview a little character.</h1><p class="intro">You can use sample imagery now and replace it when you are ready. We are keeping the first setup light.</p><div class="field"><label>Logo <span style="font-weight:400;color:var(--muted)">optional</span></label><input type="file" accept="image/*"></div><div class="field"><label>Photos <span style="font-weight:400;color:var(--muted)">optional, choose a main image later</span></label><input type="file" accept="image/*" multiple></div><div class="notice">Sample imagery is clearly labelled. Project titles, budgets and descriptions can wait.</div><div class="actions"><button class="secondary" id="back">Back</button><button class="primary" id="next">Continue</button></div>`;
      if(state.stage===3) stage.innerHTML=`<h1>Check the details people can use.</h1><p class="intro">Your login email stays private. Only the contact details you confirm become public.</p><div class="field"><label for="phone">Business phone</label><input id="phone" value="${state.phone}" placeholder="+91 98765 43210"></div><div class="field"><label><input id="same" type="checkbox" style="width:auto;margin-right:8px" ${state.whatsapp?'checked':''}>Use this number for WhatsApp</label></div><div class="field"><label for="email">Public email <span style="font-weight:400;color:var(--muted)">optional</span></label><input id="email" value="${state.email}" placeholder="hello@yourstudio.com"></div><div class="notice"><strong>Suggested introduction</strong><br>${state.name||'Your studio'} creates thoughtful ${state.categories.join(' and ').toLowerCase()||'spaces'} across ${state.areas||'your area'}.</div><div class="actions"><button class="secondary" id="back">Back</button><button class="primary" id="finish">Create my preview</button></div>`;
      bind();
    }
    function bind(){ const n=document.querySelector('#name'); if(n)n.oninput=e=>{state.name=e.target.value;renderPreview()}; const a=document.querySelector('#areas'); if(a)a.oninput=e=>{state.areas=e.target.value;renderPreview()}; const p=document.querySelector('#phone'); if(p)p.oninput=e=>state.phone=e.target.value; const em=document.querySelector('#email'); if(em)em.oninput=e=>state.email=e.target.value; const same=document.querySelector('#same'); if(same)same.onchange=e=>state.whatsapp=e.target.checked; document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>toggle(state.categories,b.dataset.cat)); document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>toggle(state.services,b.dataset.service)); const next=document.querySelector('#next'); if(next)next.onclick=()=>{state.stage=Math.min(3,state.stage+1);render()}; const back=document.querySelector('#back'); if(back)back.onclick=()=>{state.stage--;render()}; const finish=document.querySelector('#finish'); if(finish)finish.onclick=()=>alert('Prototype only — this would create the personalized preview.'); }
    function toggle(list,value){const i=list.indexOf(value);i<0?list.push(value):list.splice(i,1);render()}; function renderPreview(){document.querySelector('#previewName').textContent=state.name||'Your studio';document.querySelector('#previewText').textContent=state.name?`${state.name} creates thoughtful spaces for people who care how a place feels.`:'A clear, considered website starts with a few details from you.';document.querySelector('#previewMeta').textContent=state.areas?`Serving ${state.areas}.`:'Your service areas and focus will appear here.'}; render();
  </script>
</body>
</html>
