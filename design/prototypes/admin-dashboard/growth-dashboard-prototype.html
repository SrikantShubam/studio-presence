<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Studio Presence Growth dashboard prototype">
  <title>Studio Presence · Growth dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: 0 0% 100%; --fg: 0 0% 9%; --card: 0 0% 100%;
      --muted: 0 0% 96%; --muted-fg: 0 0% 42%; --border: 0 0% 89%;
      --primary: 0 0% 9%; --primary-fg: 0 0% 98%; --sidebar: 0 0% 98%;
      --success: 142 72% 29%; --warning: 32 95% 35%; --danger: 0 72% 45%;
      --radius: 8px; --shadow: 0 1px 2px rgb(0 0 0 / .04);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: 0 0% 5%; --fg: 0 0% 98%; --card: 0 0% 8%;
      --muted: 0 0% 14%; --muted-fg: 0 0% 67%; --border: 0 0% 23%;
      --primary: 0 0% 98%; --primary-fg: 0 0% 5%; --sidebar: 0 0% 3%;
      --success: 142 70% 45%; --warning: 38 92% 55%; --danger: 0 84% 65%;
      --shadow: 0 1px 2px rgb(0 0 0 / .24);
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; margin: 0; background: hsl(var(--bg)); color: hsl(var(--fg)); }
    body { font: 14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid hsl(var(--fg)); outline-offset: 2px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .app { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100vh; }
    .sidebar { display: flex; flex-direction: column; gap: 22px; padding: 20px 12px 14px; border-right: 1px solid hsl(var(--border)); background: hsl(var(--sidebar)); }
    .brand, .user, .person { display: flex; align-items: center; gap: 9px; }
    .brand { padding: 2px 10px; }
    .mark { display: grid; place-items: center; width: 29px; height: 29px; border: 1px solid hsl(var(--fg)); border-radius: 7px; font-size: 10px; font-weight: 700; letter-spacing: -.1em; }
    .brand strong { display: block; font-size: 12px; letter-spacing: -.02em; }
    .brand small, .workspace small, .user span { display: block; color: hsl(var(--muted-fg)); font: 10px "JetBrains Mono", monospace; letter-spacing: .04em; }
    .workspace { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: calc(100% - 8px); margin: 0 4px; padding: 9px 10px; border: 1px solid hsl(var(--border)); border-radius: var(--radius); background: hsl(var(--card)); color: hsl(var(--fg)); text-align: left; box-shadow: var(--shadow); }
    .workspace strong { display: block; margin-top: 2px; font-size: 12px; }
    .workspace i { width: 15px; height: 15px; }
    .nav-label { padding: 0 10px 5px; color: hsl(var(--muted-fg)); font: 10px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; }
    .nav { display: grid; gap: 3px; }
    .nav button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: hsl(var(--muted-fg)); text-align: left; }
    .nav button:hover { background: hsl(var(--muted)); color: hsl(var(--fg)); }
    .nav button.active { background: hsl(var(--primary)); color: hsl(var(--primary-fg)); }
    .nav button.planned { opacity: .58; }
    .nav i { width: 16px; height: 16px; }
    .side-footer { margin-top: auto; display: grid; gap: 12px; }
    .fictional { padding: 9px 10px; border: 1px dashed hsl(var(--border)); border-radius: var(--radius); color: hsl(var(--muted-fg)); font-size: 11px; }
    .avatar { display: grid; place-items: center; flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: hsl(var(--fg)); color: hsl(var(--bg)); font-size: 10px; font-weight: 700; }
    .user { padding: 0 8px; }
    .user strong { display: block; font-size: 12px; }
    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 14px 28px; border-bottom: 1px solid hsl(var(--border)); background: hsl(var(--bg) / .92); backdrop-filter: blur(12px); }
    .breadcrumbs, .top-actions { display: flex; align-items: center; gap: 8px; }
    .breadcrumbs { color: hsl(var(--muted-fg)); font-size: 12px; }
    .breadcrumbs strong { color: hsl(var(--fg)); }
    .button, .icon-button, .input, .select, textarea { border: 1px solid hsl(var(--border)); border-radius: var(--radius); background: hsl(var(--bg)); color: hsl(var(--fg)); }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 7px 12px; font-size: 12px; font-weight: 600; }
    .button:hover, .icon-button:hover { background: hsl(var(--muted)); }
    .button.primary { border-color: hsl(var(--primary)); background: hsl(var(--primary)); color: hsl(var(--primary-fg)); }
    .button.primary:hover { opacity: .87; }
    .button.ghost { background: transparent; }
    .button.danger { color: hsl(var(--danger)); }
    .button i, .icon-button i { width: 15px; height: 15px; }
    .icon-button { display: grid; place-items: center; width: 34px; height: 34px; }
    .content { width: min(1440px,100%); margin: auto; padding: 30px 28px 72px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow, .mono { color: hsl(var(--muted-fg)); font: 10px "JetBrains Mono", monospace; }
    .eyebrow { margin: 0 0 5px; letter-spacing: .02em; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 5px; font-size: clamp(24px,3vw,30px); letter-spacing: -.05em; line-height: 1.1; }
    h2 { margin-bottom: 4px; font-size: 16px; letter-spacing: -.025em; }
    h3 { margin-bottom: 4px; font-size: 13px; }
    .lead-copy { margin-bottom: 0; color: hsl(var(--muted-fg)); font-size: 13px; }
    .grid { display: grid; gap: 16px; }
    .card { min-width: 0; border: 1px solid hsl(var(--border)); border-radius: var(--radius); background: hsl(var(--card)); box-shadow: var(--shadow); }
    .card-pad { padding: 18px; }
    .kpi-grid { grid-template-columns: repeat(4,minmax(0,1fr)); margin-bottom: 18px; }
    .kpi { padding: 16px; }
    .kpi-top, .split, .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .kpi-top { margin-bottom: 17px; color: hsl(var(--muted-fg)); font-size: 12px; }
    .kpi-top i { width: 16px; height: 16px; }
    .kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -.07em; }
    .kpi-foot { display: flex; justify-content: space-between; gap: 5px; margin-top: 6px; color: hsl(var(--muted-fg)); font-size: 11px; }
    .up { color: hsl(var(--success)); font-weight: 600; }
    .overview-grid, .analytics-grid { grid-template-columns: minmax(0,1.35fr) minmax(300px,.75fr); }
    .card-head { padding: 16px 18px; border-bottom: 1px solid hsl(var(--border)); }
    .card-head p { margin: 3px 0 0; color: hsl(var(--muted-fg)); font-size: 11px; }
    .card-head .button { flex: 0 0 auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 10px 18px; color: hsl(var(--muted-fg)); font: 10px "JetBrains Mono", monospace; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
    td { padding: 13px 18px; border-top: 1px solid hsl(var(--border)); font-size: 12px; white-space: nowrap; vertical-align: middle; }
    tbody tr:hover { background: hsl(var(--muted) / .5); }
    .lead-row { cursor: pointer; }
    .person .avatar { width: 27px; height: 27px; font-size: 9px; }
    .person strong, .person span { display: block; }
    .person span { color: hsl(var(--muted-fg)); font-size: 11px; }
    .badge { display: inline-flex; align-items: center; min-height: 22px; padding: 3px 8px; border: 1px solid hsl(var(--border)); border-radius: 999px; color: hsl(var(--muted-fg)); font-size: 10px; font-weight: 600; white-space: nowrap; }
    .badge.solid { border-color: hsl(var(--fg)); background: hsl(var(--fg)); color: hsl(var(--bg)); }
    .badge.success { border-color: hsl(var(--success) / .3); background: hsl(var(--success) / .1); color: hsl(var(--success)); }
    .badge.warning { border-color: hsl(var(--warning) / .3); background: hsl(var(--warning) / .1); color: hsl(var(--warning)); }
    .chart { padding: 14px 18px 15px; }
    .chart svg { display: block; width: 100%; height: 214px; }
    .chart-grid { stroke: hsl(var(--border)); stroke-width: 1; }
    .chart-line { fill: none; stroke: hsl(var(--fg)); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .chart-area { fill: hsl(var(--fg) / .08); }
    .chart-dot { fill: hsl(var(--bg)); stroke: hsl(var(--fg)); stroke-width: 2; }
    .chart-label { fill: hsl(var(--muted-fg)); font: 10px "JetBrains Mono", monospace; }
    .source-list, .stack { display: grid; gap: 14px; }
    .source-list { padding: 18px; }
    .source-line { display: grid; gap: 7px; }
    .source-meta { display: flex; justify-content: space-between; font-size: 12px; }
    .source-meta span:last-child { color: hsl(var(--muted-fg)); font: 10px "JetBrains Mono", monospace; }
    .bar, .progress { height: 7px; overflow: hidden; border-radius: 99px; background: hsl(var(--muted)); }
    .bar span, .progress span { display: block; height: 100%; border-radius: inherit; background: hsl(var(--fg)); }
    .notice { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid hsl(var(--border)); border-radius: var(--radius); background: hsl(var(--muted) / .45); color: hsl(var(--muted-fg)); font-size: 12px; }
    .notice i { width: 16px; height: 16px; flex: 0 0 auto; color: hsl(var(--fg)); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .toolbar-left, .toolbar-right, .filters, .action-links { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; top: 50%; left: 10px; width: 15px; height: 15px; color: hsl(var(--muted-fg)); transform: translateY(-50%); }
    .input, .select { min-height: 35px; padding: 7px 10px; font-size: 12px; }
    .input-wrap .input { width: 235px; padding-left: 32px; }
    .select { padding-right: 28px; }
    .filter, .tab { min-height: 29px; padding: 5px 10px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: hsl(var(--muted-fg)); font-size: 11px; }
    .filter:hover, .filter.active, .tab.active { border-color: hsl(var(--border)); background: hsl(var(--muted)); color: hsl(var(--fg)); }
    .tabs { display: flex; gap: 3px; padding: 4px; border: 1px solid hsl(var(--border)); border-radius: 7px; background: hsl(var(--muted)); }
    .tab { border-radius: 5px; }
    .tab.active { background: hsl(var(--card)); box-shadow: var(--shadow); }
    .tiny-action { display: inline-flex; align-items: center; gap: 5px; padding: 5px 7px; border: 1px solid hsl(var(--border)); border-radius: 5px; color: hsl(var(--muted-fg)); font-size: 10px; }
    .tiny-action:hover { background: hsl(var(--muted)); color: hsl(var(--fg)); }
    .tiny-action i { width: 13px; height: 13px; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-top: 1px solid hsl(var(--border)); }
    .list-row:first-child { padding-top: 0; border-top: 0; }
    .list-row:last-child { padding-bottom: 0; }
    .list-row p { margin: 2px 0 0; color: hsl(var(--muted-fg)); font-size: 11px; }
    .empty { padding: 42px 18px; color: hsl(var(--muted-fg)); text-align: center; }
    .empty i { width: 25px; height: 25px; margin-bottom: 10px; }
    .empty p { margin: 0; font-size: 12px; }
    .mobile-cards { display: none; }
    .preview { min-height: 280px; overflow: hidden; border: 1px solid hsl(var(--border)); border-radius: var(--radius); }
    .preview-top { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid hsl(var(--border)); font-size: 11px; }
    .preview-hero { display: grid; grid-template-columns: 1fr .7fr; gap: 20px; padding: 24px 20px; }
    .preview-hero h3 { margin-top: 25px; font-size: 24px; letter-spacing: -.06em; }
    .preview-shape { min-height: 150px; background: repeating-linear-gradient(135deg,hsl(var(--muted)),hsl(var(--muted)) 12px,hsl(var(--border)) 12px,hsl(var(--border)) 13px); }
    .timeline { padding: 18px; }
    .event { position: relative; display: grid; grid-template-columns: 27px minmax(0,1fr) auto; gap: 11px; padding-bottom: 22px; }
    .event::before { content: ""; position: absolute; top: 28px; bottom: 0; left: 13px; width: 1px; background: hsl(var(--border)); }
    .event:last-child { padding-bottom: 0; } .event:last-child::before { display: none; }
    .event-dot { position: relative; z-index: 1; display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid hsl(var(--border)); border-radius: 50%; background: hsl(var(--card)); }
    .event-dot i { width: 13px; height: 13px; } .event p { margin: 0; font-size: 12px; }
    .event p span { color: hsl(var(--muted-fg)); } .event time { color: hsl(var(--muted-fg)); font: 10px "JetBrains Mono",monospace; white-space: nowrap; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
    .field { display: grid; gap: 6px; } .field.full { grid-column: 1/-1; } .field label { font-size: 11px; font-weight: 600; } .field small { color: hsl(var(--muted-fg)); font-size: 11px; }
    textarea.input { min-height: 92px; resize: vertical; }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 20; display: none; background: rgb(0 0 0 / .46); }
    .drawer-backdrop.open { display: block; }
    .drawer { position: fixed; top: 0; right: 0; z-index: 21; display: flex; flex-direction: column; width: min(470px,100%); height: 100%; border-left: 1px solid hsl(var(--border)); background: hsl(var(--bg)); box-shadow: -8px 0 30px rgb(0 0 0 / .12); transform: translateX(100%); transition: transform .2s ease; }
    .drawer.open { transform: translateX(0); } .drawer-head, .drawer-foot { padding: 18px 20px; border-bottom: 1px solid hsl(var(--border)); } .drawer-foot { display: flex; gap: 8px; border-top: 1px solid hsl(var(--border)); border-bottom: 0; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 30; max-width: calc(100vw - 32px); padding: 11px 14px; border: 1px solid hsl(var(--border)); border-radius: var(--radius); background: hsl(var(--fg)); color: hsl(var(--bg)); box-shadow: 0 8px 24px rgb(0 0 0 / .16); font-size: 12px; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .2s,transform .2s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .mobile-nav { display: none; }
    .setup-grid { grid-template-columns: minmax(0,1.1fr) repeat(2,minmax(220px,.8fr)); margin-top:16px; }
    .checklist { display:grid; gap:10px; padding:18px; }
    .check-item { display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid hsl(var(--border)); }
    .check-item:first-child { padding-top:0; border-top:0; }
    .check-item i { width:16px; height:16px; color:hsl(var(--success)); }
    .check-item.pending i { color:hsl(var(--muted-fg)); }
    .check-item strong { display:block; font-size:12px; }
    .check-item span { display:block; margin-top:2px; color:hsl(var(--muted-fg)); font-size:11px; }
    .globe-card { min-height:280px; }
    .globe-wrap { display:grid; grid-template-columns:minmax(190px,.9fr) minmax(0,1fr); align-items:center; gap:20px; padding:18px; }
    .globe { width:100%; max-width:250px; margin:auto; }
    .globe circle, .globe path, .globe ellipse { fill:none; stroke:hsl(var(--fg)); stroke-width:1.2; }
    .globe .land { fill:hsl(var(--fg)); stroke:none; opacity:.82; }
    .globe .pin { fill:hsl(var(--fg)); stroke:hsl(var(--bg)); stroke-width:2; }
    .location-list { display:grid; gap:12px; }
    .location-row { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; }
    .location-row span:last-child { color:hsl(var(--muted-fg)); font:10px "JetBrains Mono",monospace; }
    .settings-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .settings-card .card-pad { display:grid; gap:15px; }
    .settings-card .field + .field { margin-top:2px; }
    .field input, .field select { width:100%; }
    .switch-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid hsl(var(--border)); }
    .switch-row:first-child { padding-top:0; border-top:0; }
    .switch { position:relative; width:34px; height:20px; border:1px solid hsl(var(--border)); border-radius:99px; background:hsl(var(--muted)); }
    .switch::after { content:""; position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%; background:hsl(var(--muted-fg)); transition:transform .15s,background .15s; }
    .switch.on { border-color:hsl(var(--fg)); background:hsl(var(--fg)); }
    .switch.on::after { background:hsl(var(--bg)); transform:translateX(14px); }
    .digital-grid { grid-template-columns:minmax(300px,.75fr) minmax(0,1.25fr); }
    .qr-card { display:grid; place-items:center; min-height:365px; padding:24px; text-align:center; }
    .qr { width:180px; height:180px; padding:12px; border:1px solid hsl(var(--border)); border-radius:var(--radius); background:hsl(var(--bg)); }
    .qr rect { fill:hsl(var(--fg)); }
    .qr rect.invert { fill:hsl(var(--bg)); }
    .option-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .option { display:flex; align-items:center; gap:8px; padding:10px; border:1px solid hsl(var(--border)); border-radius:var(--radius); color:hsl(var(--muted-fg)); font-size:11px; }
    .option input { accent-color:hsl(var(--fg)); }
    @media (max-width:1050px) { .kpi-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } .overview-grid,.analytics-grid,.setup-grid,.digital-grid { grid-template-columns: 1fr; } }
    @media (max-width:760px) {
      .app { display: block; padding-bottom: 68px; } .sidebar { display: none; } .topbar { min-height: 56px; padding: 11px 15px; } .topbar .button { display: none; }
      .content { padding: 23px 15px 40px; } .page-head { flex-direction: column; gap: 12px; margin-bottom: 18px; } .page-head > .button,.page-head > .tabs { width: 100%; }
      .page-head > .button { min-height: 40px; } h1 { font-size: 25px; } .kpi-grid { gap: 9px; } .kpi { padding: 13px; } .kpi-value { font-size: 22px; } .kpi-top { margin-bottom: 12px; font-size: 11px; }
      .card-head { padding: 14px; } .card-pad { padding: 14px; } .table-wrap { display: none; } .mobile-cards { display: grid; gap: 9px; padding: 10px; }
      .mobile-lead { display: grid; gap: 11px; padding: 13px; border: 1px solid hsl(var(--border)); border-radius: var(--radius); background: hsl(var(--card)); }
      .toolbar { align-items: stretch; } .toolbar-left,.toolbar-right { width: 100%; } .input-wrap,.input-wrap .input,.toolbar-right .select { width: 100%; } .form-grid { grid-template-columns: 1fr; } .field.full { grid-column: auto; }
      .preview-hero { grid-template-columns: 1fr; } .globe-wrap { grid-template-columns:1fr; } .globe { max-width:210px; } .settings-grid { grid-template-columns:1fr; } .digital-grid { grid-template-columns:1fr; } .mobile-nav { position: fixed; right:0; bottom:0; left:0; z-index:10; display:grid; grid-template-columns:repeat(5,1fr); padding:7px 5px max(7px,env(safe-area-inset-bottom)); border-top:1px solid hsl(var(--border)); background:hsl(var(--bg) / .94); backdrop-filter:blur(14px); }
      .mobile-nav button { display:grid; justify-items:center; gap:3px; padding:5px 1px; border:0; background:transparent; color:hsl(var(--muted-fg)); font-size:9px; } .mobile-nav button.active { color:hsl(var(--fg)); font-weight:700; } .mobile-nav i { width:17px; height:17px; }
      .drawer { top:auto; bottom:0; width:100%; height:min(88vh,650px); border-left:0; border-radius:16px 16px 0 0; transform:translateY(100%); } .drawer.open { transform:translateY(0); } .drawer-head { padding:17px 16px; } .drawer-body { padding:16px; } .drawer-foot { padding:13px 16px max(13px,env(safe-area-inset-bottom)); } .drawer-foot .button { flex:1; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><div class="mark">SP</div><div><strong>Studio Presence</strong><small>Growth workspace</small></div></div>
      <button class="workspace" type="button" data-action="toast" data-message="Workspace switcher is represented in this prototype."><span><small>Workspace</small><strong>Aranya Studio</strong></span><i data-lucide="chevrons-up-down"></i></button>
      <div><div class="nav-label">Workspace</div><nav class="nav" id="side-nav"></nav></div>
      <div class="side-footer"><div class="fictional"><strong>Prototype mode</strong><br>Every person, enquiry, metric, and action is fictional sample data.</div><div class="user"><div class="avatar">AK</div><div><strong>Arjun Khanna</strong><span>Owner · Growth</span></div></div></div>

      if (name === 'preview') toast('Preview opened in this prototype. Production preview routing is not connected here.');
      if (name === 'download-qr') toast('QR export simulated. The production flow will download a print-ready asset.');
      if (name === 'copy-card') toast('Public digital-card link copied in the prototype.');
      if (name === 'save-digital') toast('Digital-card configuration saved in prototype state.');
      if (name === 'save-setup') toast('Setup details saved in prototype state.');
      if (name === 'save-settings') toast('Workspace settings saved in prototype state.');
      if (name === 'toggle-switch') { action.classList.toggle('on'); toast(action.classList.contains('on') ? 'Enabled in prototype state.' : 'Disabled in prototype state.'); }
      if (name === 'invite') toast('Invite form would open here in the production dashboard.');
      if (name === 'revoke') toast('Member access revocation simulated.');
      if (name === 'period') toast(action.textContent.trim() + ' period selected.');
      if (name === 'save-lead' && selectedLead) {
        selectedLead.status = document.getElementById('drawer-status').value;
        selectedLead.assignee = document.getElementById('drawer-assignee').value;
        selectedLead.note = document.getElementById('drawer-note').value;
        closeDrawer(); render(); toast('Lead changes saved in prototype state.');
      }
    });
    document.addEventListener('input', (event) => {
      if (event.target.id === 'lead-search') {
        query = event.target.value; render();
        const search = document.getElementById('lead-search');
        search.focus(); search.setSelectionRange(search.value.length, search.value.length);
      }
    });
    document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeDrawer(); });
    window.addEventListener('hashchange', render);
    const media = matchMedia('(prefers-color-scheme: dark)');
    media.addEventListener?.('change', () => { if ((document.documentElement.dataset.preference || 'light') === 'system') setTheme('system', false); });
    setTheme(localStorage.getItem('sp-growth-theme') || 'light', false);
    render();
    })();
  </script>
</body>
</html>
