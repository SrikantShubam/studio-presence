 Enquiries · scale 0–60</span></div></div></div>`}
function chartTip(e,i){const box=e.currentTarget.getBoundingClientRect();$('#tooltip').innerHTML=`<strong>${['April','May','June','July','August','September'][i]} 2026</strong><br>${[556,756,878,1126,1248,1248][i]} visitors · ${[11,17,16,26,25,31][i]} enquiries`;$('#tooltip').style.left=Math.min(e.clientX||box.x,innerWidth-210)+'px';$('#tooltip').style.top=(e.clientY||box.y)+20+'px';$('#tooltip').classList.remove('hidden')}

function leadTable(){return `<section class="panel" id="enquiries"><div class="panelhead"><div><h2>${state.page==='overview'?'Your enquiry desk':'All enquiries'}</h2><small>Representative sample leads · review demo contact details before calling</small></div><button class="btn" onclick="exportCSV()">${icon('download')}Export</button></div><div class="toolbar"><div class="tabs" role="group" aria-label="Enquiry status">${['All','New','Contacted','Quoted','Won'].map(s=>`<button class="${state.status===s?'active':''}" aria-pressed="${state.status===s}" onclick="state.status='${s}';render()">${s} <small>${leads.filter(l=>s==='All'||l.status===s).length}</small></button>`).join('')}</div><input id="search" class="input search" aria-label="Search enquiries" placeholder="Search name, locality, budget, notes…" value="${esc(state.query)}" oninput="state.query=this.value;refreshRows()"></div>${state.city?`<div class="row" style="padding:0 20px 14px"><span class="pill">${esc(state.city)}</span><button class="btn" onclick="state.city='';render()">Clear city filter ×</button></div>`:''}<div id="rows">${leadRows()}</div></section>`}

function overview(){let count=leads.filter(l=>l.status==='New').length;return heading('Your studio, at a glance.','Start with the conversations that need you.',`<span class="pill">${icon('calendar-days')}September 2026</span>`)+`<div class="row wrap quickactions">${newButton()}<button class="btn" onclick="shareCard()">${icon('message-circle')}Share WhatsApp vCard</button><button class="btn" onclick="navigate('estimate')">${icon('sliders-horizontal')}Tune pricing ₹/sqft</button><a class="btn" href="https://ashish-interiors.in" target="_blank" rel="noopener">View live site ${icon('arrow-up-right')}</a></div>${count?`<div class="notice"><div class="row">${icon('clock-3')}<div><strong>${count} enquiries are waiting for a first response</strong><br><small>A quick reply helps turn an enquiry into a site visit.</small></div></div><button class="btn" onclick="state.status='New';state.city='';state.query='';navigate('leads')">Review new enquiries ${icon('arrow-right')}</button></div>`:''}${metrics()}<div class="chartgrid">${chart()}${cityDemand()}</div>${leadTable()}`}
function openLead(id){const l=leads.find(l=>l.id===id);state.selected=id;$('#leadDialog').innerHTML=`<div class="dialoginner"><div class="dialoghead"><span class="muted">Enquiry details · Sample</span><button class="btn iconbtn" onclick="closeLead()" aria-label="Close enquiry">${icon('x')}</button></div><h1 id="leadTitle">${esc(l.name)}</h1><p class="muted">${esc(l.locality)}, ${esc(l.city)}</p><div class="sectionline"><div class="row between"><strong>${esc(l.type)}</strong><span class="mono">${esc(l.budget)}</span></div><small>${esc(l.timeline)} · Received ${esc(l.age.toLowerCase())}</small></div><div class="sectionline"><h3>Client brief</h3><p style="margin-top:9px">${esc(l.brief)}</p><small>Source: ${esc(l.source)}</small></div><div class="sectionline"><label class="field">Lead status<select id="leadStatus" onchange="updateStatus(this.value)">${['New','Contacted','Quoted','Won'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select><small>Opening WhatsApp does not automatically mark a lead contacted.</small></label></div><div class="sectionline"><label class="field">Private studio notes<textarea id="leadNotes" rows="6" placeholder="Next step, measurements, preferences…" oninput="$('#saveNotes').disabled=false">${esc(l.notes)}</textarea></label><button class="btn" id="saveNotes" disabled onclick="saveNotes()" style="margin-top:10px">Save notes</button><p><small id="noteFeedback">Notes stay in this demo session. Closing also saves your note.</small></p></div><small>Demo phone: +${l.phone}</small></div><div class="sheetfooter"><a class="btn wa" href="${waURL(l)}" target="_blank" rel="noopener">${icon('message-circle')}WhatsApp</a><a class="btn" href="tel:+${l.phone}">${icon('phone')}Call client</a></div>`;$('#leadDialog').showModal();icons()}

function newLead(){modal('Log an offline enquiry',`<p class="muted" style="margin-bottom:18px">Keep walk-ins and phone consultations with your website enquiries.</p><form id="newLeadForm" class="gap" onsubmit="addLead(event)"><label class="field">Client name<input class="input" name="name" required maxlength="80" autofocus></label><div class="formgrid"><label class="field">Indian mobile number<input class="input" name="phone" required inputmode="tel" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit mobile"></label><label class="field">City<select name="city">${cities.map(c=>`<option>${c[0]}</option>`).join('')}</select></label></div><div class="formgrid"><label class="field">Locality<input name="locality" class="input" required maxlength="80"></label><label class="field">Source<select name="source"><option>Studio walk-in</option><option>Phone consultation</option></select></label></div><div class="formgrid"><label class="field">Project type<select name="type"><option>Full home</option><option>Modular kitchen</option><option>Renovation</option><option>Commercial space</option></select></label><label class="field">Budget in lakh<input class="input" name="budget" type="number" min=".1" max="1000" step=".1" required></label></div><label class="field">Client brief<textarea name="brief" rows="3" maxlength="2000"></textarea></label><button class="btn primary" type="submit">Save enquiry</button></form>`)}
function addLead(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.name.trim()||!d.locality.trim()){toast('Enter a client name and locality');return}leads.unshift({id:Date.now(),name:d.name.trim(),phone:'91'+d.phone,city:d.city,locality:d.locality.trim(),type:d.type,budget:`₹${d.budget}L`,value:Number(d.budget),source:d.source,status:'New',age:'Just now',timeline:'To be discussed',brief:d.brief,notes:''});$('#modal').close();state.status='All';state.city='';state.query='';navigate('leads');toast('Enquiry added to your desk')}

step="50" value="${state.area}" oninput="state.area=+this.value;updateQuote()"><div class="row between muted"><small>400 sqft</small><small>3,500 sqft</small></div><hr class="divider"><h3>Home type</h3><div class="choices" style="margin:12px 0 24px">${[1,2,3,4].map((n,i)=>`<button class="btn ${state.home===i?'active':''}" onclick="state.home=${i};render()">${n} BHK</button>`).join('')}</div><h3>Finish package</h3><div class="choices" style="margin-top:12px">${['Essential','Premium','Luxe'].map((n,i)=>`<button class="btn ${state.finish===i?'active':''}" onclick="state.finish=${i};render()">${n}</button>`).join('')}</div><hr class="divider"><small>Your indicative investment</small><div id="quote" aria-live="polite"></div></div></section></div>`}

function cardBrief(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.name.trim()||!d.brief.trim()){toast('Enter your name and brief');return}leads.unshift({id:Date.now(),name:d.name.trim(),phone:'91'+d.phone,city:state.settings.city,locality:'Card enquiry',type:'To be discussed',budget:'Not provided',value:0,source:'Digital QR Card',status:'New',age:'Just now',timeline:'To be discussed',brief:d.brief,notes:''});$('#modal').close();toast('Demo brief added to enquiries with Digital QR Card attribution')}
function download(name,type,data){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportQR(){download('ashish-interiors-card-qr.svg','image/svg+xml',$('#qrGraphic svg').outerHTML);toast('Print QR downloaded')}
function vescape(s){return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function downloadVCard(){download('ashish-interiors.vcf','text/vcard',['BEGIN:VCARD','VERSION:3.0',`FN:${vescape(state.settings.name)}`,`ORG:${vescape(state.settings.name)}`,`TEL;TYPE=WORK:+${state.settings.phone}`,`EMAIL:${state.settings.email}`,'URL:https://ashish-interiors.in/card','END:VCARD',''].join('\r\n'));toast('Studio contact downloaded')}

function updateTiles(){if(!$('#embedTiles'))return;$('#embedTiles').innerHTML=[0,1,2].map(i=>`<div class="previewtile">${icon('instagram')}<small>${state.urls[i]?'Link added':'Post '+(i+1)}</small><small>Not verified</small></div>`).join('');icons()}

function settings(){return heading('Your studio. Your workspace.','Keep public details, account access and lead routing separate.')+`<form id="settingsForm" onsubmit="saveSettings(event)"><div class="cols"><div class="gap"><section class="panel"><div class="panelhead"><h2>Studio identity & domain</h2></div><div class="panelbody gap">${[['name','Studio name'],['tagline','Tagline'],['city','Primary city'],['domain','Custom domain']].map(([k,n])=>field(k,n,state.settings[k])).join('')}</div></section><section class="panel"><div class="panelhead"><h2>Account credentials & lead routing</h2></div><div class="panelbody gap">${field('email','Primary login email',state.settings.email,'email')}${field('alerts','Secondary notification email',state.settings.alerts,'email')}${field('phone','Studio WhatsApp number with country code',state.settings.phone,'tel')}<button class="btn" type="button" onclick="toast('Demo: no password email sent. Connect authentication to enable resets.')">Request password reset</button></div></section></div><div class="gap"><section class="panel"><div class="panelhead"><h2>Team access</h2><button class="btn" type="button" onclick="invite()">Invite member</button></div><div class="panelbody">${state.team.map(m=>`<div class="sectionline row between"><div><strong>${esc(m.name)}</strong><br><small>${esc(m.email)}</small></div><span class="pill">${m.role}</span></div>`).join('')}<p class="muted" style="margin-top:16px">Studio workspaces are designed to be isolated by Postgres Row-Level Security (RLS). This standalone demo does not enforce tenant access.</p></div></section><section class="panel"><div class="panelhead"><h2>Notification preferences</h2></div><div class="panelbody">${['Instant WhatsApp lead alerts','Daily summary email digest'].map((n,i)=>`<label class="toggleline"><span>${n}</span><input type="checkbox" ${state.notifications[i]?'checked':''} onchange="state.notifications[${i}]=this.checked"></label>`).join('')}<small>Demo preferences only. WhatsApp alerts require an approved messaging integration.</small></div></section><section class="panel"><div class="panelhead"><h2>Appearance</h2></div><div class="panelbody choices">${['light','dark','system'].map(t=>`<button type="button" class="btn ${state.theme===t?'active':''}" onclick="captureSettings();setTheme('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></section></div></div><div class="row" style="margin-top:24px"><button class="btn primary" type="submit">Save workspace settings</button><small>Saved for this demo session only</small></div></form>`}
function field(name,label,value,type='text'){return `<label class="field">${label}<input class="input" name="${name}" type="${type}" value="${esc(value)}" required ${name==='phone'?'pattern="91[6-9][0-9]{9}"':''}></label>`}
function captureSettings(){if($('#settingsForm'))Object.assign(state.settings,Object.fromEntries(new FormData($('#settingsForm'))))}
function saveSettings(e){e.preventDefault();captureSettings();toast('Workspace settings saved for this session')}
function invite(){captureSettings();modal('Invite a teammate',`<form class="gap" onsubmit="addMember(event)"><label class="field">Email address<input class="input" name="email" type="email" required></label><label class="field">Workspace role<select name="role"><option>Editor</option><option>Viewer</option></select></label><p class="muted">Editors manage content and enquiries. Viewers have read-only access.</p><button class="btn primary">Create demo invitation</button><small>No email is sent and no real account access is granted.</small></form>`)}

function integrations(){return heading('Connect the tools behind your website.','Credential layout preview. Do not enter production secrets into this demo.')+`<div class="cols"><section class="panel"><div class="panelhead"><h2>Instagram oEmbed · Meta</h2><span class="pill">Not connected</span></div><div class="panelbody gap"><p class="muted">Hand-curated posts and reels, rendered through authenticated oEmbed on your server.</p><label class="field">Meta App ID <small>META_APP_ID</small><input class="input" id="metaID" inputmode="numeric" placeholder="App ID"></label>${secret('metaSecret','Meta App Secret / System User Token')}<button class="btn" onclick="validateMeta()">Validate Meta token</button><p id="metaResult" role="status" class="muted">Live token validation is unavailable in a standalone HTML file.</p><hr class="divider"><h3>Integration requirements</h3><small>Basic Display is not used. Confirm current Meta permissions, quotas and metadata handling requirements before enabling production embeds. The brief's 1,000 requests/hour limit is a planning assumption, not a verified quota.</small><button class="btn" onclick="editor.page='Home';editor.selected='social';navigate('sections')">Manage curated post URLs</button></div></section><section class="panel"><div class="panelhead"><h2>WhatsApp Business Platform</h2><span class="pill">Optional add-on</span></div><div class="panelbody gap"><p class="muted">Standard WhatsApp links work without this integration. Cloud API messaging requires server-side credentials and approved templates.</p><label class="field">WhatsApp Business Account ID <small>WABA_ID</small><input class="input" placeholder="Business account ID"></label><label class="field">Phone Number ID <small>PHONE_ID</small><input class="input" placeholder="Phone number ID"></label>${secret('wabaToken','Permanent System User Access Token')}<label class="field">Planned webhook endpoint<input class="input mono" readonly value="https://api.studio-presence.in/webhooks/meta-waba"></label><button class="btn" onclick="toast('Configuration preview only. No credentials stored or sent.')">Check connection requirements</button><small>Tokens remain unsaved and are cleared when leaving this screen. Configure real credentials only in a secure backend.</small></div></section></div>`}
function validateMeta(){$('#metaResult').textContent=!$('#metaID').value||!$('#metaSecret').value?'Both fields are required to demonstrate a validation request.':'Demo credentials entered. No request sent: authenticated validation requires a secure backend.';toast('No live Meta validation performed')}
function exportCSV(){const safe=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('sample-enquiries.csv','text/csv;charset=utf-8','\uFEFF'+[['Client','Locality','City','Budget','Source','Status','Notes'],...filtered().map(l=>[l.name,l.locality,l.city,l.budget,l.source,l.status,l.notes])].map(r=>r.map(safe).join(',')).join('\r\n'));toast('Filtered enquiries exported')}
function render(){$('#crumb').textContent=titles[state.page];$('#navigation').innerHTML=Object.entries(titles).map(([id,label],i)=>`${i===3?'<div class="navlabel">Your website</div>':i===6?'<div class="navlabel">Workspace</div>':''}<button data-page="${id}" class="${id===state.page?'active':''}" ${id===state.page?'aria-current="page"':''} onclick="navigate('${id}')">${icon(navIcons[i])}${label}${id==='leads'?`<span class="pill">${leads.filter(l=>l.status==='New').length}</span>`:''}</button>`).join('');$('#content').innerHTML=({overview,leads:()=>heading('Every enquiry deserves a next step.','Review the brief, start a conversation, then record what happens.',newButton())+leadTable(),estimate,analytics,card:digitalCard,sections,settings,integrations})[state.page]();icons();updateQuote();updateTiles();if(state.page==='sections')updateWebsitePreview()}

const websiteSections={hero:['Hero','image'],about:['About studio','file-text'],projects:['Projects','images'],services:['Services','layers'],social:['Instagram','instagram'],contact:['Contact','phone'],footer:['Footer','panel-bottom']};

const editor={page:'Home',selected:'hero',language:'en',device:'desktop',mode:'edit',savedAt:'',publishedAt:''};
let website={hero:{enabled:true,image:'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1200&q=80',alt:'Living room with warm timber finishes and neutral furniture',en:{title:'Spaces shaped around the way you live.',body:'Thoughtful interiors for homes in Patna. From the first conversation to the final detail, we bring your space together.',cta:'Discuss your home'},hi:{title:'आपकी ज़िंदगी के हिसाब से बना घर।',body:'पटना में आपके घर के लिए सोच-समझकर तैयार किए गए इंटीरियर। पहली बातचीत से आख़िरी काम तक, हम आपके साथ हैं।',cta:'अपने घर के बारे में बात करें'}},about:{enabled:true,en:{title:'A studio that listens first.',body:'We start with your routines, your priorities and the way your family uses a space. Then we plan a home that works for you.'},hi:{title:'पहले आपकी बात, फिर डिज़ाइन।',body:'आपकी दिनचर्या, आपकी ज़रूरतें और परिवार के रहने का तरीका समझकर हम आपके घर की योजना बनाते हैं।'}},projects:{enabled:true,en:{title:'A closer look at our work.'},hi:{title:'हमारे काम की एक झलक।'},items:[{title:'Boring Road residence',location:'Patna · Full home',image:'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1200&q=80'},{title:'A quieter family home',location:'Patna · Renovation',image:'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1200&q=80'}]},services:{enabled:true,en:{title:'From a single room to a whole home.'},hi:{title:'एक कमरे से पूरे घर तक।'},items:[{title:'Interior design',body:'Space planning, materials and a design that fits your daily life.',price:'From ₹85 / sqft'},{title:'Modular kitchens',body:'Practical layouts, thoughtful storage and durable finishes.',price:'Estimate after consultation'},{title:'Turnkey interiors',body:'One studio coordinating design, materials and installation.',price:'Scope-based estimate'}]},social:{enabled:false,en:{title:'Notes from the studio.'},hi:{title:'स्टूडियो की कुछ झलकियाँ।'},urls:Array(6).fill('')},contact:{enabled:true,en:{title:'Tell us what you have in mind.',body:'Share a floor plan, a question or an idea. We will take it from there.',cta:'Start a conversation'},hi:{title:'आपके मन में क्या है?',body:'फ्लोर प्लान, कोई सवाल या अपना विचार साझा करें। आगे की बात हम साथ मिलकर करेंगे।',cta:'बातचीत शुरू करें'},phone:'919999999999',email:'hello@ashish-interiors.in',address:'Patna, Bihar'},footer:{enabled:true,en:{title:'Ashish Interiors',body:'Homes made for everyday living. Patna, Bihar.'},hi:{title:'आशीष इंटीरियर्स',body:'रोज़मर्रा की ज़िंदगी के लिए बने घर। पटना, बिहार।'}}};
let savedWebsite=structuredClone(website),publishedWebsite=structuredClone(website);
function websiteChanges(base){return Object.keys(website).filter(k=>JSON.stringify(website[k])!==JSON.stringify(base[k]))}
function websiteStatus(){const dirty=websiteChanges(savedWebsite).length,draft=websiteChanges(publishedWebsite).length;return dirty?`${dirty} section${dirty===1?'':'s'} with unsaved changes`:draft?'Draft saved · ready to review':editor.publishedAt?'Demo publication up to date':'No unpublished changes'}
function sections(){return heading('See your website. Make it yours.','Edit a section and check the result in the preview. Changes stay in this demo.',`<div class="row"><button class="btn" onclick="discardWebsite()">Discard changes</button><button class="btn primary" onclick="reviewWebsite()">${icon('check-check')}Review & publish</button></div>`)+`<div class="editor-toolbar"><div class="row"><label class="row"><span class="muted">Page</span><select aria-label="Website page" onchange="editor.page=this.value;editor.selected=pageSections[this.value][0];render()">${Object.keys(pageSections).map(p=>`<option ${p===editor.page?'selected':''}>${p}</option>`).join('')}</select></label><label class="row"><span class="muted">Copy</span><select aria-label="Content language" onchange="editor.language=this.value;render()"><option value="en" ${editor.language==='en'?'selected':''}>English</option><option value="hi" ${editor.language==='hi'?'selected':''}>हिन्दी</option></select></label></div><div class="row"><span class="editor-status" id="websiteStatus" role="status">${websiteStatus()}</span><button class="btn" onclick="saveWebsiteDraft()">${icon('save')}Save draft</button></div></div><div class="tabs mobile-editor-tabs" aria-label="Editor workspace"><button class="${editor.mode==='edit'?'active':''}" onclick="editor.mode='edit';render()">${icon('sliders-horizontal')} Edit content</button><button class="${editor.mode==='preview'?'active':''}" onclick="editor.mode='preview';render()">${icon('monitor')} Preview website</button></div><div class="editor-layout mode-${editor.mode}"><section class="panel edit-controls"><div class="section-picker" aria-label="Website sections">${pageSections[editor.page].map(k=>`<button class="${editor.selected===k?'selected':''} ${website[k].enabled?'':'off'}" onclick="selectWebsiteSection('${k}')" aria-pressed="${editor.selected===k}">${icon(websiteSections[k][1])}${websiteSections[k][0]}${website[k].enabled?'<span class="dot" aria-label="Enabled"></span>':''}</button>`).join('')}</div><div class="edit-fields" id="websiteFields">${websiteFields()}</div></section><section class="panel preview-panel"><div class="preview-toolbar"><div><strong>Website preview</strong><div class="preview-address">${esc(state.settings.domain)}/${editor.page==='Home'?'':editor.page.toLowerCase()}</div></div><div class="tabs"><button class="${editor.device==='desktop'?'active':''}" aria-label="Desktop preview" onclick="editor.device='desktop';render()">${icon('monitor')}</button><button class="${editor.device==='mobile'?'active':''}" aria-label="Mobile preview" onclick="editor.device='mobile';render()">${icon('smartphone')}</button></div></div><div class="preview-canvas"><iframe id="websitePreview" class="preview-frame ${editor.device==='mobile'?'phone':''}" title="Editable website preview" sandbox="allow-same-origin"></iframe></div><div class="editor-footer">Click a section in the preview to edit it. Demo content, including project captions and prices. No live website is changed.</div></section></div>`}
function selectWebsiteSection(k){editor.selected=k;editor.mode='edit';render()}
function copyField(label,key,multiline=false){const value=website[editor.selected][editor.language][key]||'';return `<label class="field">${label}${multiline?`<textarea rows="4" maxlength="1500" oninput="editWebsiteCopy('${key}',this.value)">${esc(value)}</textarea>`:`<input class="input" maxlength="160" value="${esc(value)}" oninput="editWebsiteCopy('${key}',this.value)">`}</label>`}
function websiteFields(){const k=editor.selected,s=website[k];let html=`<div class="row between"><h3>${websiteSections[k][0]}</h3><span class="pill">${editor.language==='en'?'English':'हिन्दी'}</span></div><label class="toggleline"><span>Show on website</span><input aria-label="Show ${websiteSections[k][0]} on website" type="checkbox" ${s.enabled?'checked':''} onchange="website[editor.selected].enabled=this.checked;websiteChanged()"></label>`;if(!s.enabled)html+='<p class="editor-help">This section is hidden in the website preview. You can still edit its content.</p>';html+=copyField(k==='footer'?'Studio name':'Heading','title');if(s[editor.language].body!==undefined)html+=copyField('Description','body',true);if(s[editor.language].cta!==undefined)html+=copyField('Button label','cta');if(k==='hero')html+=`<label class="field">Cover image<img class="editor-photo" src="${s.image}" alt="Current hero image"><input type="file" accept="image/jpeg,image/png,image/webp" aria-label="Upload hero image" onchange="uploadWebsiteImage(this)"></label><label class="field">Image description<input class="input" value="${esc(s.alt)}" oninput="website.hero.alt=this.value;websiteChanged()"></label><p class="editor-help">Choose a JPG, PNG or WebP, up to 4 MB. Kept in this browser session only.</p>`;if(k==='projects'||k==='services'){html+=`<p class="editor-help">${k==='projects'?'Project titles and locations':'Service details'} are shared across languages in this prototype.</p>`;html+=s.items.map((item,i)=>`<div class="itembox"><div class="row between"><strong>${k==='projects'?'Project':'Service'} ${i+1}</strong><button class="editor-link" onclick="website['${k}'].items.splice(${i},1);render();websiteChanged()">Remove</button></div><label class="field">Title<input class="input" value="${esc(item.title)}" oninput="editWebsiteItem(${i},'title',this.value)"></label>${k==='projects'?`<img class="editor-photo" src="${item.image}" alt="Sample interior project"><label class="field">Location & scope<input class="input" value="${esc(item.location)}" oninput="editWebsiteItem(${i},'location',this.value)"></label>`:`<label class="field">Description<textarea rows="3" oninput="editWebsiteItem(${i},'body',this.value)">${esc(item.body)}</textarea></label><label class="field">Price note<input class="input" value="${esc(item.price)}" oninput="editWebsiteItem(${i},'price',this.value)"></label>`}</div>`).join('');html+=`<button class="btn" onclick="addWebsiteItem()">${icon('plus')}Add ${k==='projects'?'project':'service'}</button>`}if(k==='social'){html+=s.urls.map((u,i)=>`<label class="field">Post or reel ${i+1}<input class="input" type="url" placeholder="https://www.instagram.com/p/…/" value="${esc(u)}" oninput="website.social.urls[${i}]=this.value;websiteChanged()"></label>`).join('');html+=`<button class="btn" onclick="validateWebsiteSocial()">Check post links</button><p class="editor-help" id="socialFeedback">Links are curated manually. Live oEmbeds need a connected Meta backend.</p>`}if(k==='contact')html+=['phone','email','address'].map(key=>`<label class="field">${{phone:'WhatsApp number with country code',email:'Contact email',address:'Studio location'}[key]}<input class="input" value="${esc(s[key])}" oninput="website.contact['${key}']=this.value;websiteChanged()"></label>`).join('');return html}
function editWebsiteCopy(key,value){website[editor.selected][editor.language][key]=value;websiteChanged()}
function editWebsiteItem(index,key,value){website[editor.selected].items[index][key]=value;websiteChanged()}
function addWebsiteItem(){const k=editor.selected;website[k].items.push(k==='projects'?{title:'New sample project',location:'Add location & scope',image:website.hero.image}:{title:'New service',body:'Describe what this service includes.',price:'Add a price note'});render();websiteChanged()}
function websiteChanged(){clearTimeout(window.websiteTimer);if($('#websiteStatus')){$('#websiteStatus').textContent=websiteStatus();$('#websiteStatus').classList.toggle('dirty',websiteChanges(savedWebsite).length>0)}window.websiteTimer=setTimeout(updateWebsitePreview,120)}
function uploadWebsiteImage(input){const file=input.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>4*1024*1024){toast('Choose a JPG, PNG or WebP under 4 MB');input.value='';return}const reader=new FileReader();reader.onload=()=>{website.hero.image=reader.result;render();websiteChanged();toast('Cover image updated in the draft')};reader.readAsDataURL(file)}
function saveWebsiteDraft(){savedWebsite=structuredClone(website);editor.savedAt=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});websiteChanged();toast('Website draft saved for this session')}
function discardWebsite(){if(!websiteChanges(savedWebsite).length){toast('No unsaved changes to discard');return}modal('Discard unsaved website changes?',`<p>Your last saved draft will be restored. Published demo content is unchanged.</p><div class="row" style="margin-top:20px"><button class="btn" onclick="$('#modal').close()">Keep editing</button><button class="btn primary" onclick="website=structuredClone(savedWebsite);$('#modal').close();render();toast('Last saved draft restored')">Discard unsaved changes</button></div>`)}
function reviewWebsite(){const changes=websiteChanges(publishedWebsite);if(!changes.length){toast('No website changes to publish');return}modal('Review your website changes',`<p>These sections will be updated in the <strong>demo publication</strong>. Your real website will not change.</p><ul class="review-list">${changes.map(k=>`<li><span>${websiteSections[k][0]}</span><span class="pill">${website[k].enabled?'Updated':'Hidden'}</span></li>`).join('')}</ul><p class="muted">${websiteChanges(savedWebsite).length?'Your current edits will also be saved as the latest draft.':'Your saved draft is ready.'}</p><div class="row" style="margin-top:20px"><button class="btn" onclick="$('#modal').close()">Back to editing</button><button class="btn primary" onclick="publishedWebsite=structuredClone(website);savedWebsite=structuredClone(website);editor.publishedAt=new Date().toISOString();$('#modal').close();render();toast('Demo website published. No live site changed.')">Publish demo changes</button></div>`)}
function validateWebsiteSocial(){const urls=website.social.urls.filter(Boolean),valid=urls.every(u=>/^https:\/\/(www\.)?instagram\.com\/(p|reel)\/[A-Za-z0-9_-]+\/?(?:\?.*)?$/.test(u));$('#socialFeedback').textContent=!urls.length?'Add at least one post or reel URL.':!valid?'Use Instagram post or reel URLs only.':`${urls.length} link formats checked. Live oEmbed verification requires a connected backend.`}
function websitePreviewHTML(){const lang=editor.language,copy=k=>website[k][lang],on=k=>website[k].enabled&&pageSections[editor.page].includes(k),attr=k=>`data-edit="${k}" class="site-section ${editor.selected===k?'chosen':''}" tabindex="0" aria-label="Edit ${websiteSections[k][0]}"`;let body=`<header class="site-nav"><strong>${esc(state.settings.name)}</strong><nav>${Object.keys(pageSections).map(p=>`<button data-page="${p}" class="${p===editor.page?'current':''}">${p}</button>`).join('')}</nav><span>${lang==='en'?'Patna, Bihar':'पटना, बिहार'}</span></header>`;if(on('hero'))body+=`<section ${attr('hero')}><div class="site-hero"><div><p class="eyebrow">${lang==='en'?'Interior design · Patna':'इंटीरियर डिज़ाइन · पटना'}</p><h1>${esc(copy('hero').title)}</h1><p>${esc(copy('hero').body)}</p><button class="site-button">${esc(copy('hero').cta)} ↗</button></div><img src="${website.hero.image}" alt="${esc(website.hero.alt)}"></div></section>`;if(on('about'))body+=`<section ${attr('about')}><div class="site-about"><p class="eyebrow">${lang==='en'?'Our studio':'हमारा स्टूडियो'}</p><h2>${esc(copy('about').title)}</h2><p>${esc(copy('about').body)}</p></div></section>`;if(on('projects')&&website.projects.items.length)body+=`<section ${attr('projects')}><h2>${esc(copy('projects').title)}</h2><div class="project-grid">${website.projects.items.map(item=>`<article><img src="${item.image}" alt="Sample interior project"><h3>${esc(item.title)}</h3><small>${esc(item.location)}</small></article>`).join('')}</div></section>`;if(on('services')&&website.services.items.length)body+=`<section ${attr('services')}><h2>${esc(copy('services').title)}</h2><div class="service-grid">${website.services.items.map(item=>`<article><h3>${esc(item.title)}</h3><p>${esc(item.body)}</p><small>${esc(item.price)}</small></article>`).join('')}</div></section>`;if(on('social')&&website.social.urls.some(Boolean))body+=`<section ${attr('social')}><h2>${esc(copy('social').title)}</h2><div class="service-grid">${website.social.urls.filter(Boolean).map((u,i)=>`<article class="social-placeholder"><span>Instagram ${i+1}</span><small>Link added · embed not verified</small></article>`).join('')}</div></section>`;if(on('contact'))body+=`<section ${attr('contact')}><div class="site-contact"><div><h2>${esc(copy('contact').title)}</h2><p>${esc(copy('contact').body)}</p><button class="site-button">${esc(copy('contact').cta)} ↗</button></div><div><p>${esc(website.contact.address)}</p><p>${esc(website.contact.email)}</p><p>+${esc(website.contact.phone)}</p></div></div></section>`;if(on('footer'))body+=`<footer ${attr('footer')}><strong>${esc(copy('footer').title)}</strong><p>${esc(copy('footer').body)}</p><small>Sample website preview</small></footer>`;if(!pageSections[editor.page].some(k=>website[k].enabled))body+='<div class="preview-empty">All sections on this page are hidden. Enable a section to show it here.</div>';return `<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;color:#18181b;background:#fafafa;font:13px/1.7 Inter,Arial,sans-serif}button{font:inherit;cursor:pointer}h1,h2,h3,p{margin:0}h1{font:40px/1.12 Georgia,serif;letter-spacing:-1px;margin:15px 0}h2{font:28px/1.25 Georgia,serif;margin:0 0 16px}h3{font-size:14px;font-weight:500;margin-top:12px}p{color:#52525b;margin:12px 0}small{font-size:10px;color:#71717a}.site-nav{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px 30px;border-bottom:1px solid #e4e4e7}.site-nav strong{font:18px Georgia,serif}.site-nav nav{display:flex;gap:10px}.site-nav button{border:0;background:none;font-size:10px;padding:4px 0;color:#71717a}.site-nav .current{color:#18181b;border-bottom:1px solid}.site-nav span{font-size:9px;white-space:nowrap}.site-section{position:relative;padding:36px 30px;border-bottom:1px solid #e4e4e7;cursor:pointer;outline-offset:-3px}.site-section:hover{outline:1px dashed #71717a}.site-section.chosen{outline:2px solid #a1a1aa}.site-section.chosen:before{content:'Editing this section';position:absolute;top:0;right:0;background:#18181b;color:#fafafa;font:9px Arial;padding:4px 7px;z-index:1}.site-hero{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}.site-hero img{width:100%;height:330px;object-fit:cover}.eyebrow{font-size:10px;margin:0;color:#71717a}.site-button{border:1px solid #18181b;background:#18181b;color:#fafafa;padding:11px 16px;font-size:11px;margin-top:12px}.site-about{max-width:600px;padding:10px 0}.site-about .eyebrow{margin-bottom:12px}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.project-grid img{width:100%;height:190px;object-fit:cover}.service-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.service-grid article{padding:16px 0;border-top:1px solid #a1a1aa}.service-grid p{font-size:12px}.site-contact{display:grid;grid-template-columns:1.5fr 1fr;gap:25px}.site-contact>div:last-child{padding-top:20px;font-size:11px;overflow-wrap:anywhere}.social-placeholder{aspect-ratio:1;background:#f4f4f5;display:grid;place-content:center;text-align:center}.social-placeholder small{display:block}footer.site-section{padding-top:25px;padding-bottom:25px}footer p{font-size:11px}.preview-empty{padding:60px 30px;text-align:center;color:#71717a}@media(max-width:540px){.site-nav{padding:20px;flex-wrap:wrap}.site-nav nav{order:3;width:100%;justify-content:space-between}.site-section{padding:28px 20px}.site-hero{grid-template-columns:1fr;gap:20px}.site-hero img{height:250px}h1{font-size:36px}h2{font-size:26px}.project-grid,.service-grid,.site-contact{grid-template-columns:1fr}.project-grid img{height:240px}.site-contact>div:last-child{padding:0}}</style></head><body>${body}</body></html>`}
function updateWebsitePreview(){const frame=$('#websitePreview');if(!frame)return;frame.onload=()=>{const doc=frame.contentDocument;if(!doc)return;doc.querySelectorAll('[data-edit]').forEach(el=>{const select=e=>{e.preventDefault();selectWebsiteSection(el.dataset.edit)};el.addEventListener('click',select);el.addEventListener('keydown',e=>{if(e.key==='Enter'){select(e)}})});doc.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{editor.page=el.dataset.page;editor.selected=pageSections[editor.page][0];render()}));const selected=doc.querySelector(`[data-edit=${editor.selected}]`);if(selected&&editor.selected!==pageSections[editor.page][0])selected.scrollIntoView({block:'start'})};frame.srcdoc=websitePreviewHTML();if($('#websiteStatus'))$('#websiteStatus').textContent=websiteStatus()}

state.page=titles[location.hash.slice(1)]?location.hash.slice(1):'overview';render();
