<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Presence — SaaS Landing Page Designs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-[#111215] text-[#E4E7EB] min-h-screen flex flex-col">

  <!-- Header / Navigation Bar -->
  <header class="border-b border-white/10 bg-[#16181E]/90 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-18 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-orange-600 flex items-center justify-center text-white font-bold text-sm">
          SP
        </div>
        <div>
          <span class="font-semibold tracking-wide text-white text-base">Studio Presence</span>
          <span class="text-xs text-white/40 block">SaaS Landing Page &bull; 3 Visual Directions</span>
        </div>
      </div>

      <!-- Viewport Device Controls -->
      <div class="hidden md:flex items-center gap-2 bg-black/40 border border-white/10 rounded-lg p-1">
        <button onclick="setViewport('100%')" id="btn-desktop" class="px-3 py-1.5 rounded text-xs font-mono transition-all bg-white/10 text-white font-medium">
          Desktop (100%)
        </button>
        <button onclick="setViewport('768px')" id="btn-tablet" class="px-3 py-1.5 rounded text-xs font-mono transition-all text-white/50 hover:text-white">
          Tablet (768px)
        </button>
        <button onclick="setViewport('375px')" id="btn-mobile" class="px-3 py-1.5 rounded text-xs font-mono transition-all text-white/50 hover:text-white">
          Mobile (375px)
        </button>
      </div>

      <div class="flex items-center gap-3">
        <a id="open-new-tab" href="01-heron-technical-swiss.html" target="_blank" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/15 border border-white/10 text-xs font-medium text-white flex items-center gap-2 transition-colors">
          <span>Open Full Screen</span>
          <svg class="w-3.5 h-3.5 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Prototype Switcher Tabs -->
  <div class="border-b border-white/10 bg-[#16181E] px-6 py-4">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Tab 1: Heron AI Clean Swiss -->
      <button onclick="switchDesign('01-heron-technical-swiss.html', this)" class="design-tab text-left p-4 rounded-xl border transition-all border-orange-500/50 bg-orange-500/10 relative overflow-hidden group">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-mono uppercase tracking-widest text-orange-400 font-semibold">Direction 01 &bull; Heron AI Inspired</span>
          <span class="w-2 h-2 rounded-full bg-orange-500"></span>
        </div>
        <h3 class="text-sm font-semibold text-white group-hover:text-orange-300 transition-colors">Heron Clean Swiss Modernist</h3>
        <p class="text-xs text-white/60 mt-1 line-clamp-2">
          CAD measurement rulers framing real interior photography, live HUD tracker, sequential fracture audits, working hover states, and interactive CAD Telemetry ROI calculator.
        </p>
      </button>

      <!-- Tab 2: Pure Editorial -->
      <button onclick="switchDesign('02-pure-editorial-monochrome.html', this)" class="design-tab text-left p-4 rounded-xl border transition-all border-white/10 hover:border-white/20 bg-white/[0.02] group">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-mono uppercase tracking-widest text-stone-300 font-semibold">Direction 02 &bull; Pure Editorial</span>
          <span class="w-2 h-2 rounded-full bg-transparent"></span>
        </div>
        <h3 class="text-sm font-semibold text-white group-hover:text-stone-300 transition-colors">Luxury Architectural Atelier</h3>
        <p class="text-xs text-white/60 mt-1 line-clamp-2">
          Hero Before/After comparison slider, separated exhibition plates with visible hovers, Architectural Commission Yield ROI calculator, and generous monograph spacing.
        </p>
      </button>

      <!-- Tab 3: Warm Contemporary -->
      <button onclick="switchDesign('03-dark-modern-architectural.html', this)" class="design-tab text-left p-4 rounded-xl border transition-all border-white/10 hover:border-white/20 bg-white/[0.02] group">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-mono uppercase tracking-widest text-amber-300 font-semibold">Direction 03 &bull; Warm Contemporary</span>
          <span class="w-2 h-2 rounded-full bg-transparent"></span>
        </div>
        <h3 class="text-sm font-semibold text-white group-hover:text-amber-300 transition-colors">Warm Sand & Terracotta Studio</h3>
        <p class="text-xs text-white/60 mt-1 line-clamp-2">
          12-section architecture with 3D room tilt, Daylight/Golden/Warm lighting moods, interactive WhatsApp simulator, Before/After slider, and executive ROI modeler.
        </p>
      </button>

    </div>
  </div>

  <!-- Interactive Iframe Preview Workspace -->
  <main class="grow flex flex-col items-center justify-center p-4 lg:p-8 bg-[#0B0C0E]">
    <div id="preview-wrapper" class="w-full transition-all duration-300 ease-in-out h-[82vh] bg-white rounded-xl shadow-2xl overflow-hidden border border-white/10">
      <iframe id="preview-frame" src="01-heron-technical-swiss.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    let currentDesign = '01-heron-technical-swiss.html';

    function switchDesign(url, tabElement) {
      currentDesign = url;
      document.getElementById('preview-frame').src = url;
      document.getElementById('open-new-tab').href = url;

      // Update tab styles
      document.querySelectorAll('.design-tab').forEach(tab => {
        tab.classList.remove('border-orange-500/50', 'bg-orange-500/10', 'border-white/30', 'bg-white/[0.06]');
        tab.classList.add('border-white/10', 'bg-white/[0.02]');
        const dot = tab.querySelector('span.rounded-full');
        if (dot) dot.classList.add('bg-transparent');
      });

      tabElement.classList.remove('border-white/10', 'bg-white/[0.02]');
      tabElement.classList.add('border-white/30', 'bg-white/[0.06]');
      const activeDot = tabElement.querySelector('span.rounded-full');
      if (activeDot) activeDot.classList.remove('bg-transparent');
    }

    function setViewport(width) {
      const wrapper = document.getElementById('preview-wrapper');
      wrapper.style.maxWidth = width;

      // Update button active state
      ['desktop', 'tablet', 'mobile'].forEach(id => {
        const btn = document.getElementById(`btn-${id}`);
        btn.classList.remove('bg-white/10', 'text-white', 'font-medium');
        btn.classList.add('text-white/50');
      });

      if (width === '100%') {
        document.getElementById('btn-desktop').classList.add('bg-white/10', 'text-white', 'font-medium');
      } else if (width === '768px') {
        document.getElementById('btn-tablet').classList.add('bg-white/10', 'text-white', 'font-medium');
      } else if (width === '375px') {
        document.getElementById('btn-mobile').classList.add('bg-white/10', 'text-white', 'font-medium');
      }
    }
  </script>
</body>
</html>
